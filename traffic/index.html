<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Moved — districtry traffic report</title>
<!-- REDIRECT SHELL. The fleet traffic report served here from 2026-08-11 to
     2026-09-09 and now lives on the site it reports on, at
     districtry.com/traffic.html. It moved because the report is about
     districtry rather than about this site: it belongs beside that domain's
     own privacy and sponsorship pages, where the same brand, the same theme
     key and the same standing links apply and are gated.

     This path is linked from districtry's sponsorship page, from the
     FLOSS/fund application, and from wherever else it has been shared, so it
     forwards rather than 404s.

     GitHub Pages cannot issue a 301, so this is the strongest available
     substitute, the same shape the districtry repo's own shells use: an
     instant meta refresh (Google treats it as a redirect), a canonical naming
     the real page so the signal consolidates there, and a JS replace so the
     browser leaves no history entry. Deliberately NOT noindex — that would
     block the consolidation this exists to do. -->
<meta http-equiv="refresh" content="0; url=https://districtry.com/traffic.html" />
<link rel="canonical" href="https://districtry.com/traffic.html" />
<script>location.replace("https://districtry.com/traffic.html" + location.search + location.hash);</script>
<style>
  body { margin: 0; padding: 48px 20px; background: #f4f7f9; color: #14181c;
         font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width: 34rem; margin: 0 auto; }
  a { color: #5730ab; font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>This page moved</h1>
  <p>The districtry fleet traffic report now lives at
    <a href="https://districtry.com/traffic.html">districtry.com/traffic.html</a>.</p>
  <p>You should be redirected automatically. If not, follow the link above.</p>
</main>
</body>
</html>
